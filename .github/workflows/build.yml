
name: Build Autoskill Hominhtuan95 EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --onefile --windowed --name Autoskill_Hominhtuan95 Autoskill_Hominhtuan95.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Autoskill_Hominhtuan95_EXE
          path: dist/Autoskill_Hominhtuan95.exe
